name: Portfolio CI and Pages deployment

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.openai/hosting.json'
  pull_request:
    paths:
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.openai/hosting.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site and assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/projects.js
      - name: Check HTML, assets, resume, and deployment inputs
        run: python3 scripts/check_site.py
      - name: Check whitespace
        run: git diff --check
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVISION: ${{ github.sha }}
        run: |
          echo "### GitHub Pages deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify live Pages files and resume
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deployed files match this revision
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 scripts/verify_live.py "$PAGE_URL" --attempts 6

  legacy-mirror:
    name: Check ChatGPT mirror (does not deploy)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check mirror and report drift
        run: python3 scripts/verify_live.py https://sundar-reddy-portfolio.sundarreddy022.chatgpt.site/ --allow-drift
